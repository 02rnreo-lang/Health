<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주 5일 근비대 루틴</title>
    <meta name="theme-color" content="#0f1115">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1e222a;
            --text-main: #ffffff;
            --text-sub: #a0aabf;
            --accent-red: #ff4757;
            --accent-blue: #1e90ff;
            --accent-green: #2ed573;
            --accent-yellow: #ffa502;
            --accent-purple: #9c88ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
            -webkit-tap-highlight-color: transparent;
        }

        .top-header {
            background-color: #000;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .top-header h1 { font-size: 1.2rem; color: #ffcc00; margin-bottom: 5px; }
        .routine-summary { font-size: 0.8rem; color: var(--text-sub); display: flex; justify-content: space-around; }

        .container { padding: 15px; }
        .day-section { display: none; }
        .day-section.active { display: block; }
        
        .day-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .exercise-name { font-size: 1.1rem; font-weight: bold; }
        .exercise-sets-info { font-size: 0.9rem; color: var(--text-sub); }
        
        .exercise-point {
            font-size: 0.85rem;
            color: #d1d8e0;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .sets-container { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .set-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #4a5568;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-sub);
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
        }
        .set-circle.completed {
            border-color: transparent;
            color: #fff;
            font-weight: bold;
        }
        .set-circle.add-btn {
            border: 2px dashed #4a5568;
            font-size: 1.2rem;
            color: var(--text-sub);
            background: rgba(255,255,255,0.02);
        }

        /* 하단 네비게이션 (7개 아이콘 대응) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1a1d24;
            display: flex;
            border-top: 1px solid #333;
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-sub);
            font-weight: bold;
            cursor: pointer;
        }
        .nav-item.active { color: #fff; background-color: rgba(255,255,255,0.1); }

        .color-mon { border-color: var(--accent-red); color: var(--accent-red); }
        .bg-mon.completed { background-color: var(--accent-red); }
        .color-tue { border-color: var(--accent-blue); color: var(--accent-blue); }
        .bg-tue.completed { background-color: var(--accent-blue); }
        .color-wed { border-color: var(--accent-green); color: var(--accent-green); }
        .bg-wed.completed { background-color: var(--accent-green); }
        .color-thu { border-color: var(--accent-yellow); color: var(--accent-yellow); }
        .bg-thu.completed { background-color: var(--accent-yellow); }
        .color-fri { border-color: var(--accent-purple); color: var(--accent-purple); }
        .bg-fri.completed { background-color: var(--accent-purple); }

        /* 달력 스타일 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; }
        .calendar-btn { background: #2c3240; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .cal-day-head { font-size: 0.8rem; color: var(--text-sub); padding-bottom: 5px; font-weight: bold; }
        .cal-day-cell { 
            background-color: var(--card-bg); 
            min-height: 48px;
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.85rem; 
            cursor: pointer; 
            position: relative;
            border: 1px solid transparent;
        }
        .cal-day-cell.today { border-color: var(--accent-blue); font-weight: bold; }
        .cal-day-cell.selected { background-color: #2e3646; border-color: var(--accent-green); }
        .cal-day-cell.has-log::after { content: '🔥'; font-size: 0.65rem; margin-top: 2px; }
        .log-detail-box { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="top-header">
        <h1>주 5일 근비대 루틴 (60분)</h1>
        <div class="routine-summary">
            <span>⏱️ 60~90초 휴식</span>
            <span>🔄 8~12회 반복</span>
            <span>🔥 RPE 8~9</span>
        </div>
    </div>

    <div class="container" id="app-container"></div>

    <div class="bottom-nav" id="bottom-nav">
        <div class="nav-item" data-day="mon">월</div>
        <div class="nav-item" data-day="tue">화</div>
        <div class="nav-item" data-day="wed">수</div>
        <div class="nav-item" data-day="thu">목</div>
        <div class="nav-item" data-day="fri">금</div>
        <div class="nav-item" data-day="cal">달력</div>
        <div class="nav-item" data-day="info">요약</div>
    </div>

    <script>
        const routineData = {
            "mon": {
                title: "월요일: 가슴 + 삼두", colorClass: "color-mon", bgClass: "bg-mon",
                exercises: [
                    { name: "가슴운동 ①", sets: 5, point: "가장 무겁게 하는 주력 운동" },
                    { name: "가슴운동 ②", sets: 4, point: "다른 각도 (중량 운동)" },
                    { name: "가슴운동 ③", sets: 4, point: "고립 (펌핑) 운동" },
                    { name: "삼두운동 ①", sets: 4, point: "" },
                    { name: "삼두운동 ②", sets: 3, point: "삼두는 과하지 않게, 가슴 자극에 집중" }
                ]
            },
            "tue": {
                title: "화요일: 등 + 이두", colorClass: "color-tue", bgClass: "bg-tue",
                exercises: [
                    { name: "등운동 ①", sets: 5, point: "가장 무겁게 하는 주력 운동" },
                    { name: "등운동 ②", sets: 4, point: "다른 각도" },
                    { name: "등운동 ③", sets: 4, point: "고립 운동" },
                    { name: "후면어깨", sets: 4, point: "후면어깨로 밸런스 보완" },
                    { name: "이두운동 ①", sets: 4, point: "" },
                    { name: "이두운동 ②", sets: 3, point: "이두는 보조적으로 자극" }
                ]
            },
            "wed": {
                title: "수요일: 하체", colorClass: "color-wed", bgClass: "bg-wed",
                exercises: [
                    { name: "하체운동 ① (대퇴사두)", sets: 5, point: "하체는 자세를 우선" },
                    { name: "하체운동 ② (복합)", sets: 4, point: "①, ②는 복합 운동 위주" },
                    { name: "하체운동 ③ (햄스트링)", sets: 4, point: "햄스트링 + 종아리까지 균형 있게" },
                    { name: "하체운동 ④ (대퇴사두)", sets: 4, point: "" },
                    { name: "종아리", sets: 4, point: "" }
                ]
            },
            "thu": {
                title: "목요일: 어깨", colorClass: "color-thu", bgClass: "bg-thu",
                exercises: [
                    { name: "프레스운동", sets: 5, point: "프레스운동을 가장 먼저 (바이킹 프레스 추천)" },
                    { name: "측면어깨 ①", sets: 5, point: "측면 + 후면 균형 중요" },
                    { name: "후면어깨", sets: 4, point: "승모는 필요 시만 추가" },
                    { name: "측면어깨 ② 또는 승모", sets: 4, point: "" }
                ]
            },
            "fri": {
                title: "금요일: 하체 + 보완", colorClass: "color-fri", bgClass: "bg-fri",
                exercises: [
                    { name: "하체운동 ⑤ (둔근·햄스트링)", sets: 5, point: "하체 후면 강화에 집중" },
                    { name: "하체운동 ⑥", sets: 4, point: "상체 보완으로 밸런스 유지" },
                    { name: "가슴운동 ④", sets: 4, point: "팔은 약한 부위 위주로" },
                    { name: "등운동 ④", sets: 4, point: "" },
                    { name: "팔 약점 (이두 또는 삼두)", sets: 3, point: "" }
                ]
            },
            "cal": {
                title: "운동 기록 달력", colorClass: "color-wed"
            },
            "info": {
                title: "주간 총 볼륨 & TIP", colorClass: "color-thu", bgClass: "bg-thu",
                content: `
                    <div style="background:#1e222a; padding:15px; border-radius:10px; margin-bottom:15px;">
                        <h3 style="color:#ffcc00; margin-bottom:10px;">📊 세트 수 요약</h3>
                        <ul style="list-style:none; line-height:1.8; color:#d1d8e0;">
                            <li>• <b>가슴:</b> 17세트+α</li>
                            <li>• <b>등:</b> 17세트+α</li>
                            <li>• <b>어깨:</b> 22세트+α</li>
                            <li>• <b>하체:</b> 30세트+α <span style="color:#2ed573;">(볼륨 높게!)</span></li>
                            <li>• <b>팔(이두/삼두):</b> 17세트+α</li>
                        </ul>
                    </div>
                    <div style="background:#1e222a; padding:15px; border-radius:10px;">
                        <h3 style="color:#ffcc00; margin-bottom:10px;">💡 진행 방법</h3>
                        <ul style="list-style:none; line-height:1.6; font-size:0.9rem; color:#d1d8e0;">
                            <li>1. 운동 ① = 가장 무겁게 하는 주력 운동</li>
                            <li>2. 8~12회 가능한 무게, 마지막 1~2회가 힘든 정도</li>
                            <li>3. 휴식은 60~90초</li>
                            <li>4. <b>+ 버튼을 눌러 세트 추가 가능</b></li>
                            <li>5. 체크한 운동 세트는 <b>달력 탭에 자동으로 기록</b>됩니다.</li>
                        </ul>
                    </div>
                `
            }
        };

        let currentCalDate = new Date();

        function getTodayStr() {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getLogs() {
            return JSON.parse(localStorage.getItem('gym_workout_logs') || '{}');
        }

        function saveLogs(logs) {
            localStorage.setItem('gym_workout_logs', JSON.stringify(logs));
        }

        function getTodaySets() {
            return JSON.parse(localStorage.getItem(`sets_${getTodayStr()}`) || '[]');
        }

        const todayIndex = new Date().getDay();
        const dayMap = { 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri' };
        let currentDay = dayMap[todayIndex] || 'info'; 

        const container = document.getElementById('app-container');
        const navItems = document.querySelectorAll('.nav-item');

        function renderApp() {
            let html = '';
            const todaySets = getTodaySets();

            navItems.forEach(item => {
                if (item.getAttribute('data-day') === currentDay) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            for (const [day, data] of Object.entries(routineData)) {
                html += `<div class="day-section ${day === currentDay ? 'active' : ''}" id="${day}">`;
                html += `<div class="day-title ${data.colorClass}">${data.title}</div>`;
                
                if (day === 'info') {
                    html += data.content;
                } else if (day === 'cal') {
                    html += `
                        <div class="calendar-header">
                            <button class="calendar-btn" onclick="changeMonth(-1)">◀ 이전</button>
                            <span id="cal-month-title"></span>
                            <button class="calendar-btn" onclick="changeMonth(1)">다음 ▶</button>
                        </div>
                        <div class="calendar-grid" id="calendar-grid"></div>
                        <div class="log-detail-box" id="log-detail-content"></div>
                    `;
                } else {
                    data.exercises.forEach((ex, exIndex) => {
                        html += `
                            <div class="exercise-card">
                                <div class="exercise-header">
                                    <div class="exercise-name">${exIndex + 1}. ${ex.name}</div>
                                    <div class="exercise-sets-info" id="info-${day}-${exIndex}">${ex.sets}세트</div>
                                </div>
                                ${ex.point ? `<div class="exercise-point">✓ ${ex.point}</div>` : ''}
                                <div class="sets-container" id="sets-${day}-${exIndex}">
                        `;
                        for (let i = 1; i <= ex.sets; i++) {
                            const setId = `${day}-${exIndex}-${i}`;
                            const isCompleted = todaySets.includes(setId);
                            html += `<div class="set-circle ${data.bgClass} ${isCompleted ? 'completed' : ''}" data-set-id="${setId}" onclick="toggleSet(this, '${setId}', '${day}')">${i}</div>`;
                        }
                        html += `<div class="set-circle add-btn" onclick="addSet('${day}', ${exIndex})">+</div>`;
                        html += `</div></div>`;
                    });
                }
                html += `</div>`;
            }
            container.innerHTML = html;

            if (currentDay === 'cal') {
                renderCalendar();
            }
        }

        function toggleSet(element, setId, day) {
            element.classList.toggle('completed');
            if (navigator.vibrate) navigator.vibrate(50);

            const completedSets = [];
            document.querySelectorAll(`.day-section#${day} .set-circle.completed:not(.add-btn)`).forEach(el => {
                if (el.dataset.setId) completedSets.push(el.dataset.setId);
            });

            const today = getTodayStr();
            localStorage.setItem(`sets_${today}`, JSON.stringify(completedSets));

            const logs = getLogs();
            if (completedSets.length > 0) {
                logs[today] = {
                    title: routineData[day]?.title || '운동 완료',
                    count: completedSets.length
                };
            } else {
                delete logs[today];
            }
            saveLogs(logs);
        }

        function addSet(day, exIndex) {
            routineData[day].exercises[exIndex].sets++;
            const newSetsCount = routineData[day].exercises[exIndex].sets;
            
            const infoEl = document.getElementById(`info-${day}-${exIndex}`);
            if (infoEl) infoEl.textContent = `${newSetsCount}세트`;

            const containerEl = document.getElementById(`sets-${day}-${exIndex}`);
            if (containerEl) {
                const addButton = containerEl.querySelector('.add-btn');
                const newCircle = document.createElement('div');
                const setId = `${day}-${exIndex}-${newSetsCount}`;
                newCircle.className = `set-circle ${routineData[day].bgClass}`;
                newCircle.setAttribute('data-set-id', setId);
                newCircle.textContent = newSetsCount;
                newCircle.onclick = function() { toggleSet(this, setId, day); };
                containerEl.insertBefore(newCircle, addButton);
            }
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function renderCalendar() {
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            
            const monthTitle = document.getElementById('cal-month-title');
            if (monthTitle) monthTitle.textContent = `${year}년 ${month + 1}월`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            
            const logs = getLogs();
            const todayStr = getTodayStr();
            
            let gridHtml = `
                <div class="cal-day-head" style="color:#ff4757;">일</div>
                <div class="cal-day-head">월</div>
                <div class="cal-day-head">화</div>
                <div class="cal-day-head">수</div>
                <div class="cal-day-head">목</div>
                <div class="cal-day-head">금</div>
                <div class="cal-day-head" style="color:#1e90ff;">토</div>
            `;
            
            for (let i = 0; i < firstDay; i++) {
                gridHtml += `<div></div>`;
            }
            
            for (let d = 1; d <= lastDate; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;
                const hasLog = !!logs[dateStr];
                
                gridHtml += `
                    <div class="cal-day-cell ${isToday ? 'today' : ''} ${hasLog ? 'has-log' : ''}" 
                         id="cell-${dateStr}" onclick="selectCalDate('${dateStr}')">
                        <span>${d}</span>
                    </div>
                `;
            }
            
            const gridEl = document.getElementById('calendar-grid');
            if (gridEl) gridEl.innerHTML = gridHtml;

            selectCalDate(todayStr);
        }

        function changeMonth(delta) {
            currentCalDate.setMonth(currentCalDate.getMonth() + delta);
            renderCalendar();
        }

        function selectCalDate(dateStr) {
            document.querySelectorAll('.cal-day-cell').forEach(c => c.classList.remove('selected'));
            const cell = document.getElementById(`cell-${dateStr}`);
            if (cell) cell.classList.add('selected');

            const logs = getLogs();
            const log = logs[dateStr];
            const detailEl = document.getElementById('log-detail-content');

            const [y, m, d] = dateStr.split('-');
            const displayDate = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;

            if (detailEl) {
                if (log) {
                    detailEl.innerHTML = `
                        <h4 style="color:#2ed573; margin-bottom:8px;">📅 ${displayDate}</h4>
                        <p style="font-size:1.1rem; font-weight:bold; color:#fff;">${log.title}</p>
                        <p style="color:var(--text-sub); margin-top:6px; font-size:0.9rem;">총 <b style="color:#ffcc00;">${log.count}세트</b> 완료! 🔥</p>
                    `;
                } else {
                    detailEl.innerHTML = `
                        <h4 style="color:var(--text-sub); margin-bottom:8px;">📅 ${displayDate}</h4>
                        <p style="color:#a0aabf; font-size:0.9rem;">운동 기록이 없습니다.</p>
                    `;
                }
            }
        }

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                navItems.forEach(nav => nav.classList.remove('active'));
                e.target.classList.add('active');
                
                currentDay = e.target.getAttribute('data-day');
                document.querySelectorAll('.day-section').forEach(section => {
                    section.classList.remove('active');
                });
                document.getElementById(currentDay).classList.add('active');
                
                if (currentDay === 'cal') {
                    renderCalendar();
                }
                window.scrollTo(0, 0);
            });
        });

        renderApp();
    </script>
</body>
</html>
