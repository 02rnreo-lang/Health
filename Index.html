<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>주간 운동 루틴</title>
    <!-- 독립 앱 실행을 위한 매니페스트 연결 -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f1115">
    <style>
        :root {
            --bg-color: #0f1115;
            --card-bg: #1e222a;
            --text-main: #ffffff;
            --text-sub: #a0aabf;
            --accent-red: #ff4757;
            --accent-blue: #1e90ff;
            --accent-green: #2ed573;
            --accent-yellow: #ffa502;
            --accent-purple: #9c88ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding-bottom: 70px;
            -webkit-tap-highlight-color: transparent;
        }

        .top-header {
            background-color: #000;
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .top-header h1 { font-size: 1.2rem; color: #ffcc00; margin-bottom: 5px; }
        .routine-summary { font-size: 0.8rem; color: var(--text-sub); display: flex; justify-content: space-around; }

        .container { padding: 15px; }
        .day-section { display: none; }
        .day-section.active { display: block; }
        
        .day-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid;
        }

        .exercise-card {
            background-color: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        
        .exercise-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .exercise-name { font-size: 1.1rem; font-weight: bold; }
        .exercise-sets-info { font-size: 0.9rem; color: var(--text-sub); }
        
        .exercise-point {
            font-size: 0.85rem;
            color: #d1d8e0;
            background: rgba(255,255,255,0.05);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .sets-container { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
        .set-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #4a5568;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            color: var(--text-sub);
            transition: all 0.2s;
            cursor: pointer;
            user-select: none;
        }
        .set-circle.completed {
            border-color: transparent;
            color: #fff;
            font-weight: bold;
        }
        .set-circle.add-btn {
            border: 2px dashed #4a5568;
            font-size: 1.2rem;
            color: var(--text-sub);
            background: rgba(255,255,255,0.02);
        }

        /* 휴식일 안내 카드 */
        .rest-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .rest-emoji { font-size: 3.5rem; margin-bottom: 15px; }
        .rest-title { font-size: 1.4rem; color: #ffcc00; margin-bottom: 10px; font-weight: bold; }
        .rest-desc { color: var(--text-sub); font-size: 0.95rem; line-height: 1.5; }

        /* 하단 네비게이션 */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #1a1d24;
            display: flex;
            border-top: 1px solid #333;
            z-index: 100;
        }
        .nav-item {
            flex: 1;
            padding: 12px 0;
            text-align: center;
            font-size: 0.7rem;
            letter-spacing: -0.5px;
            color: var(--text-sub);
            font-weight: bold;
            cursor: pointer;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .nav-item.active { color: #fff; background-color: rgba(255,255,255,0.1); }

        .color-mon { border-color: var(--accent-red); color: var(--accent-red); }
        .bg-mon.completed { background-color: var(--accent-red); }
        .color-tue { border-color: var(--accent-blue); color: var(--accent-blue); }
        .bg-tue.completed { background-color: var(--accent-blue); }
        .color-wed { border-color: var(--text-sub); color: var(--text-sub); }
        .color-thu { border-color: var(--accent-yellow); color: var(--accent-yellow); }
        .bg-thu.completed { background-color: var(--accent-yellow); }
        .color-fri { border-color: var(--accent-purple); color: var(--accent-purple); }
        .bg-fri.completed { background-color: var(--accent-purple); }
        .color-sat { border-color: var(--text-sub); color: var(--text-sub); }
        .color-sun { border-color: var(--text-sub); color: var(--text-sub); }

        /* 달력 스타일 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 1.2rem; font-weight: bold; }
        .calendar-btn { background: #2c3240; border: none; color: #fff; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
        .cal-day-head { font-size: 0.8rem; color: var(--text-sub); padding-bottom: 5px; font-weight: bold; }
        .cal-day-cell { 
            background-color: var(--card-bg); 
            min-height: 48px;
            border-radius: 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.85rem; 
            cursor: pointer; 
            position: relative;
            border: 1px solid transparent;
        }
        .cal-day-cell.today { border-color: var(--accent-blue); font-weight: bold; }
        .cal-day-cell.selected { background-color: #2e3646; border-color: var(--accent-green); }
        .cal-day-cell.has-log::after { content: '🔥'; font-size: 0.65rem; margin-top: 2px; }
        .log-detail-box { background: var(--card-bg); padding: 15px; border-radius: 10px; margin-top: 15px; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="top-header">
        <h1>맞춤형 운동 루틴</h1>
        <div class="routine-summary">
            <span>⏱️ 60~90초 휴식</span>
            <span>🔄 8~12회 반복</span>
            <span>🔥 RPE 8~9</span>
        </div>
    </div>

    <div class="container" id="app-container"></div>

    <div class="bottom-nav" id="bottom-nav">
        <div class="nav-item" data-day="mon">월</div>
        <div class="nav-item" data-day="tue">화</div>
        <div class="nav-item" data-day="wed">수</div>
        <div class="nav-item" data-day="thu">목</div>
        <div class="nav-item" data-day="fri">금</div>
        <div class="nav-item" data-day="sat">토</div>
        <div class="nav-item" data-day="sun">일</div>
        <div class="nav-item" data-day="cal">달력</div>
        <div class="nav-item" data-day="info">요약</div>
    </div>

    <script>
        const routineData = {
            "mon": {
                title: "월요일: 등 + 이두", colorClass: "color-mon", bgClass: "bg-mon", type: "workout",
                exercises: [
                    { name: "등운동 ①", sets: 5, point: "메인 풀링 운동 (중량 집중)" },
                    { name: "등운동 ②", sets: 5, point: "두 번째 등 운동" },
                    { name: "등운동 ③", sets: 4, point: "너비 및 두께 보완" },
                    { name: "이두운동 ①", sets: 4, point: "바벨 또는 덤벨 컬" },
                    { name: "이두운동 ②", sets: 4, point: "고립 펌핑 운동" }
                ]
            },
            "tue": {
                title: "화요일: 가슴 + 삼두", colorClass: "color-tue", bgClass: "bg-tue", type: "workout",
                exercises: [
                    { name: "가슴운동 ①", sets: 5, point: "메인 프레스 운동 (중량 집중)" },
                    { name: "가슴운동 ②", sets: 5, point: "인클라인 또는 다른 각도" },
                    { name: "가슴운동 ③", sets: 4, point: "딥스 또는 플라이 고립" },
                    { name: "삼두운동 ①", sets: 4, point: "푸시다운 또는 익스텐션" },
                    { name: "삼두운동 ②", sets: 4, point: "오버헤드 또는 딥스 보조" }
                ]
            },
            "wed": {
                title: "수요일: 휴식일", colorClass: "color-wed", type: "rest"
            },
            "thu": {
                title: "목요일: 어깨 + 하체", colorClass: "color-thu", bgClass: "bg-thu", type: "workout",
                exercises: [
                    { name: "어깨운동 ①", sets: 4, point: "오버헤드 프레스" },
                    { name: "어깨운동 ②", sets: 4, point: "측면 삼각주 (사이드 레터럴 레이즈)" },
                    { name: "어깨운동 ③", sets: 4, point: "후면 삼각근 보완" },
                    { name: "하체운동 ①", sets: 5, point: "스쿼트 또는 메인 하체" },
                    { name: "하체운동 ②", sets: 5, point: "레그 프레스 또는 복합 운동" },
                    { name: "하체운동 ③", sets: 5, point: "익스텐션/컬 또는 런지" }
                ]
            },
            "fri": {
                title: "금요일: 등 + 가슴 + 팔", colorClass: "color-fri", bgClass: "bg-fri", type: "workout",
                exercises: [
                    { name: "등운동 ①", sets: 4, point: "등 상부/중부 타겟" },
                    { name: "등운동 ②", sets: 4, point: "등 하부 또는 로우" },
                    { name: "가슴운동 ①", sets: 4, point: "가슴 상부 타겟" },
                    { name: "가슴운동 ②", sets: 4, point: "가슴 플랫 또는 머신" },
                    { name: "이두운동", sets: 4, point: "팔 전체 펌핑" },
                    { name: "삼두운동", sets: 4, point: "팔 전체 펌핑" }
                ]
            },
            "sat": {
                title: "토요일: 휴식일", colorClass: "color-sat", type: "rest"
            },
            "sun": {
                title: "일요일: 휴식일", colorClass: "color-sun", type: "rest"
            },
            "cal": {
                title: "운동 기록 달력", colorClass: "color-wed", type: "calendar"
            },
            "info": {
                title: "주간 루틴 & TIP", colorClass: "color-thu", type: "info",
                content: `
                    <div style="background:#1e222a; padding:15px; border-radius:10px; margin-bottom:15px;">
                        <h3 style="color:#ffcc00; margin-bottom:10px;">📊 요일별 요약</h3>
                        <ul style="list-style:none; line-height:1.8; color:#d1d8e0; font-size:0.9rem;">
                            <li>• <b>월요일:</b> 등 + 이두</li>
                            <li>• <b>화요일:</b> 가슴 + 삼두</li>
                            <li>• <b>수요일:</b> 🏖️ 휴식</li>
                            <li>• <b>목요일:</b> 어깨 + 하체</li>
                            <li>• <b>금요일:</b> 등 + 가슴 + 팔</li>
                            <li>• <b>토·일:</b> 🏖️ 휴식</li>
                        </ul>
                    </div>
                    <div style="background:#1e222a; padding:15px; border-radius:10px;">
                        <h3 style="color:#ffcc00; margin-bottom:10px;">💡 이용 팁</h3>
                        <ul style="list-style:none; line-height:1.6; font-size:0.9rem; color:#d1d8e0;">
                            <li>1. 8~12회 가능한 무게, 마지막 1~2회가 힘든 강도</li>
                            <li>2. 휴식은 60~90초 유지</li>
                            <li>3. 컨디션에 따라 <b>+ 버튼</b>으로 세트 추가 가능</li>
                            <li>4. 운동 완료 후 세트를 체크하면 <b>달력에 자동으로 기록</b>됩니다.</li>
                        </ul>
                    </div>
                `
            }
        };

        let currentCalDate = new Date();

        function getTodayStr() {
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function getLogs() {
            return JSON.parse(localStorage.getItem('gym_workout_logs') || '{}');
        }

        function saveLogs(logs) {
            localStorage.setItem('gym_workout_logs', JSON.stringify(logs));
        }

        function getTodaySets() {
            return JSON.parse(localStorage.getItem(`sets_${getTodayStr()}`) || '[]');
        }

        const todayIndex = new Date().getDay(); // 0: 일, 1: 월, 2: 화, 3: 수, 4: 목, 5: 금, 6: 토
        const dayMap = { 0: 'sun', 1: 'mon', 2: 'tue', 3: 'wed', 4: 'thu', 5: 'fri', 6: 'sat' };
        let currentDay = dayMap[todayIndex] || 'info'; 

        const container = document.getElementById('app-container');
        const navItems = document.querySelectorAll('.nav-item');

        function renderApp() {
            let html = '';
            const todaySets = getTodaySets();

            navItems.forEach(item => {
                if (item.getAttribute('data-day') === currentDay) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });

            for (const [day, data] of Object.entries(routineData)) {
                html += `<div class="day-section ${day === currentDay ? 'active' : ''}" id="${day}">`;
                html += `<div class="day-title ${data.colorClass}">${data.title}</div>`;
                
                if (data.type === 'info') {
                    html += data.content;
                } else if (data.type === 'calendar') {
                    html += `
                        <div class="calendar-header">
                            <button class="calendar-btn" onclick="changeMonth(-1)">◀ 이전</button>
                            <span id="cal-month-title"></span>
                            <button class="calendar-btn" onclick="changeMonth(1)">다음 ▶</button>
                        </div>
                        <div class="calendar-grid" id="calendar-grid"></div>
                        <div class="log-detail-box" id="log-detail-content"></div>
                    `;
                } else if (data.type === 'rest') {
                    html += `
                        <div class="rest-card">
                            <div class="rest-emoji">🔋</div>
                            <div class="rest-title">휴식 및 회복의 날</div>
                            <div class="rest-desc">오늘은 가벼운 산책이나 스트레칭으로 컨디션을 조절하고<br>다음 운동을 위해 푹 쉬어주세요!</div>
                        </div>
                    `;
                } else {
                    data.exercises.forEach((ex, exIndex) => {
                        html += `
                            <div class="exercise-card">
                                <div class="exercise-header">
                                    <div class="exercise-name">${exIndex + 1}. ${ex.name}</div>
                                    <div class="exercise-sets-info" id="info-${day}-${exIndex}">${ex.sets}세트</div>
                                </div>
                                ${ex.point ? `<div class="exercise-point">✓ ${ex.point}</div>` : ''}
                                <div class="sets-container" id="sets-${day}-${exIndex}">
                        `;
                        for (let i = 1; i <= ex.sets; i++) {
                            const setId = `${day}-${exIndex}-${i}`;
                            const isCompleted = todaySets.includes(setId);
                            html += `<div class="set-circle ${data.bgClass} ${isCompleted ? 'completed' : ''}" data-set-id="${setId}" onclick="toggleSet(this, '${setId}', '${day}')">${i}</div>`;
                        }
                        html += `<div class="set-circle add-btn" onclick="addSet('${day}', ${exIndex})">+</div>`;
                        html += `</div></div>`;
                    });
                }
                html += `</div>`;
            }
            container.innerHTML = html;

            if (currentDay === 'cal') {
                renderCalendar();
            }
        }

        function toggleSet(element, setId, day) {
            element.classList.toggle('completed');
            if (navigator.vibrate) navigator.vibrate(50);

            const completedSets = [];
            document.querySelectorAll(`.day-section#${day} .set-circle.completed:not(.add-btn)`).forEach(el => {
                if (el.dataset.setId) completedSets.push(el.dataset.setId);
            });

            const today = getTodayStr();
            localStorage.setItem(`sets_${today}`, JSON.stringify(completedSets));

            const logs = getLogs();
            if (completedSets.length > 0) {
                logs[today] = {
                    title: routineData[day]?.title || '운동 완료',
                    count: completedSets.length
                };
            } else {
                delete logs[today];
            }
            saveLogs(logs);
        }

        function addSet(day, exIndex) {
            routineData[day].exercises[exIndex].sets++;
            const newSetsCount = routineData[day].exercises[exIndex].sets;
            
            const infoEl = document.getElementById(`info-${day}-${exIndex}`);
            if (infoEl) infoEl.textContent = `${newSetsCount}세트`;

            const containerEl = document.getElementById(`sets-${day}-${exIndex}`);
            if (containerEl) {
                const addButton = containerEl.querySelector('.add-btn');
                const newCircle = document.createElement('div');
                const setId = `${day}-${exIndex}-${newSetsCount}`;
                newCircle.className = `set-circle ${routineData[day].bgClass}`;
                newCircle.setAttribute('data-set-id', setId);
                newCircle.textContent = newSetsCount;
                newCircle.onclick = function() { toggleSet(this, setId, day); };
                containerEl.insertBefore(newCircle, addButton);
            }
            if (navigator.vibrate) navigator.vibrate(30);
        }

        function renderCalendar() {
            const year = currentCalDate.getFullYear();
            const month = currentCalDate.getMonth();
            
            const monthTitle = document.getElementById('cal-month-title');
            if (monthTitle) monthTitle.textContent = `${year}년 ${month + 1}월`;
            
            const firstDay = new Date(year, month, 1).getDay();
            const lastDate = new Date(year, month + 1, 0).getDate();
            
            const logs = getLogs();
            const todayStr = getTodayStr();
            
            let gridHtml = `
                <div class="cal-day-head" style="color:#ff4757;">일</div>
                <div class="cal-day-head">월</div>
                <div class="cal-day-head">화</div>
                <div class="cal-day-head">수</div>
                <div class="cal-day-head">목</div>
                <div class="cal-day-head">금</div>
                <div class="cal-day-head" style="color:#1e90ff;">토</div>
            `;
            
            for (let i = 0; i < firstDay; i++) {
                gridHtml += `<div></div>`;
            }
            
            for (let d = 1; d <= lastDate; d++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const isToday = dateStr === todayStr;
                const hasLog = !!logs[dateStr];
                
                gridHtml += `
                    <div class="cal-day-cell ${isToday ? 'today' : ''} ${hasLog ? 'has-log' : ''}" 
                         id="cell-${dateStr}" onclick="selectCalDate('${dateStr}')">
                        <span>${d}</span>
                    </div>
                `;
            }
            
            const gridEl = document.getElementById('calendar-grid');
            if (gridEl) gridEl.innerHTML = gridHtml;

            // 현재 보고 있는 달에 오늘 날짜가 포함되어 있으면 오늘 선택, 아니면 해당 월 1일 선택
            const currentYearMonth = `${year}-${String(month + 1).padStart(2, '0')}`;
            const targetSelectDate = todayStr.startsWith(currentYearMonth) ? todayStr : `${currentYearMonth}-01`;
            selectCalDate(targetSelectDate);
        }

        function changeMonth(delta) {
            currentCalDate.setMonth(currentCalDate.getMonth() + delta);
            renderCalendar();
        }

        function selectCalDate(dateStr) {
            document.querySelectorAll('.cal-day-cell').forEach(c => c.classList.remove('selected'));
            const cell = document.getElementById(`cell-${dateStr}`);
            if (cell) cell.classList.add('selected');

            const logs = getLogs();
            const log = logs[dateStr];
            const detailEl = document.getElementById('log-detail-content');

            const [y, m, d] = dateStr.split('-');
            const displayDate = `${y}년 ${parseInt(m)}월 ${parseInt(d)}일`;

            if (detailEl) {
                if (log) {
                    detailEl.innerHTML = `
                        <h4 style="color:#2ed573; margin-bottom:8px;">📅 ${displayDate}</h4>
                        <p style="font-size:1.1rem; font-weight:bold; color:#fff;">${log.title}</p>
                        <p style="color:var(--text-sub); margin-top:6px; font-size:0.9rem;">총 <b style="color:#ffcc00;">${log.count}세트</b> 완료! 🔥</p>
                    `;
                } else {
                    detailEl.innerHTML = `
                        <h4 style="color:var(--text-sub); margin-bottom:8px;">📅 ${displayDate}</h4>
                        <p style="color:#a0aabf; font-size:0.9rem;">운동 기록이 없습니다.</p>
                    `;
                }
            }
        }

        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                const targetNav = e.currentTarget;
                navItems.forEach(nav => nav.classList.remove('active'));
                targetNav.classList.add('active');
                
                currentDay = targetNav.getAttribute('data-day');
                document.querySelectorAll('.day-section').forEach(section => {
                    section.classList.remove('active');
                });
                const targetSection = document.getElementById(currentDay);
                if (targetSection) targetSection.classList.add('active');
                
                if (currentDay === 'cal') {
                    renderCalendar();
                }
                window.scrollTo(0, 0);
            });
        });

        renderApp();
    </script>
</body>
</html>
